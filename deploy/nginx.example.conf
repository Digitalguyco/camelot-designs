# Example Nginx server block for camelot-designs.com.
# Copy to /etc/nginx/sites-available/camelot-designs.com, adjust paths, then:
#   ln -s /etc/nginx/sites-available/camelot-designs.com /etc/nginx/sites-enabled/
#   certbot --nginx -d camelot-designs.com -d www.camelot-designs.com
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name camelot-designs.com www.camelot-designs.com;

    # Uploaded product/blog images, served directly — never touches Node.
    # Must match UPLOADS_DIR in .env.
    location /uploads/ {
        alias /var/www/camelot-uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next.js static build assets — safe to cache aggressively (content-hashed).
    location /_next/static/ {
        alias /var/www/camelot-designs/.next/standalone/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
